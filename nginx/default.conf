########################################################################
# Nginx — Reverse Proxy + Static File Server
#
#  [Internet] --443/80--> [Nginx] --8000--> [Flask(gunicorn)]
#                            |
#                            +--> /css /js /index.html (static)
########################################################################

# Datadog Nginx Integration이 읽는 상태 엔드포인트용 (localhost 전용)
server {
    listen 81;
    server_name localhost;

    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # docker bridge
        deny all;
        access_log off;
    }
}

server {
    listen 80;
    server_name _;

    # HTTPS를 붙인 뒤에는 아래 주석을 해제해 리다이렉트한다 (certbot이 자동 추가하기도 함)
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---------------------------------------------------------- 로그
    # json_combined 포맷은 00-upstream.conf(http 컨텍스트)에 정의되어 있다.
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ---------------------------------------------------------- 보안 헤더
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # ---------------------------------------------------------- 정적 파일
    # index.html 은 캐시하지 않는다 (?v= 가 여기서 바뀌므로 항상 최신을 받아야 한다)
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # 개발 중에는 캐시를 짧게. 파일명에 ?v= 를 붙여 무효화하고 있으므로 이걸로 충분하다.
    # 안정화 후 트래픽이 늘면 7d 로 올린다.
    location ~* \.(css|js|svg|png|jpg|jpeg|ico|webp|woff2?)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        access_log off;
        try_files $uri =404;
    }

    # index.html 은 절대 캐시하지 않는다 (?v= 가 여기서 바뀌므로)
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------- API 프록시
    location /api/ {
        # 과도한 연타 방지 (zone은 00-upstream.conf에 정의)
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://app_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering off;
    }

    # 헬스체크는 로그를 남기지 않는다 (모니터링 노이즈 방지)
    location = /api/health {
        access_log off;
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
