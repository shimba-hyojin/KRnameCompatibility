########################################################################
# http 블록에 포함되는 설정 (upstream / rate limit zone / log_format)
#
# /etc/nginx/conf.d/ 아래의 *.conf 는 알파벳 순으로 로드된다.
# limit_req_zone 은 참조보다 먼저 정의되어야 하므로 파일명을 00- 으로 시작한다.
########################################################################

upstream app_upstream {
    # docker-compose 네트워크상의 서비스명.
    # EC2에 Flask를 직접 올렸다면 127.0.0.1:8000 으로 바꾼다.
    server app:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# IP당 초당 10요청. 버스트는 server 블록의 limit_req 에서 지정한다.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# Datadog에서 파싱하기 쉬운 JSON 액세스 로그 포맷.
# log_format 은 http 컨텍스트 전용 (server 블록에 넣으면 nginx 기동 실패).
log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"query":"$args",'
    '"status":$status,'
    '"body_bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"referrer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_id":"$http_x_request_id"'
  '}';
