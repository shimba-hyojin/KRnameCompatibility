## Datadog MySQL Integration (Amazon RDS for MySQL)
##
## 이 파일은 docker-compose 의 datadog 서비스에 ./datadog/conf.d 로 마운트된다.
## 값을 채운 뒤:  docker compose restart datadog
##
## ─────────────────────────────────────────────────────────────────
## 사전 준비 1) RDS에 datadog 계정 만들기
##
##   mysql -h <RDS_ENDPOINT> -u admin -p
##
##   CREATE USER 'datadog'@'%' IDENTIFIED BY '<DATADOG_DB_PASSWORD>';
##   ALTER USER 'datadog'@'%' WITH MAX_USER_CONNECTIONS 5;
##   GRANT REPLICATION CLIENT ON *.* TO 'datadog'@'%';
##   GRANT PROCESS ON *.* TO 'datadog'@'%';
##   GRANT SELECT ON performance_schema.* TO 'datadog'@'%';
##
##   -- DBM(쿼리 단위 성능)까지 볼 경우 추가
##   CREATE SCHEMA IF NOT EXISTS datadog;
##   GRANT EXECUTE ON datadog.* TO 'datadog'@'%';
##   GRANT CREATE TEMPORARY TABLES ON datadog.* TO 'datadog'@'%';
##   GRANT SELECT ON mysql.user TO 'datadog'@'%';
##   FLUSH PRIVILEGES;
##
## 사전 준비 2) RDS 파라미터 그룹 (DBM 사용 시에만)
##   기본 파라미터 그룹은 수정할 수 없으므로 새로 만들어 인스턴스에 적용한다.
##     performance_schema = 1
##     max_digest_length = 4096
##     performance_schema_max_digest_length = 4096
##   적용 후 인스턴스 재부팅 필요.
##   DBM 없이 기본 메트릭만 볼 거면 이 단계는 건너뛰어도 된다 (dbm: false).
## ─────────────────────────────────────────────────────────────────

init_config:

instances:
  - host: <RDS_ENDPOINT>          # 예: hyojin-db.c1mmuwo2mx97.ap-northeast-1.rds.amazonaws.com
    port: 3306
    username: datadog
    password: "<DATADOG_DB_PASSWORD>"

    # Database Monitoring — 쿼리별 실행시간/실행계획.
    # 파라미터 그룹 설정을 안 했으면 false 로 두고 아래 options 메트릭만 사용한다.
    dbm: true

    # RDS 인스턴스로 인식시켜 APM/DBM 상관관계에 사용
    aws:
      instance_endpoint: <RDS_ENDPOINT>

    tags:
      - service:name-compat-db
      - project:name-compat
      - env:prod
      - dbinstanceidentifier:hyojin-db

    options:
      replication: false
      extra_status_metrics: true       # Connections, Threads, Slow_queries 등
      extra_innodb_metrics: true
      schema_size_metrics: true
      extra_performance_metrics: true  # 쿼리 통계 (performance_schema 필요)
      disable_innodb_metrics: false
